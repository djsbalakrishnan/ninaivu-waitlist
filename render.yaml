services:
  - type: web
    name: ninaivu-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,api.ninaivu.in
      - key: CORS_ALLOWED_ORIGINS
        value: https://ninaivu.in,https://www.ninaivu.in
      - key: DEFAULT_FROM_EMAIL
        value: hello@ninaivu.in
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      # Paste these manually in the Render dashboard after first deploy
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

# ninaivu-worker is intentionally omitted for the waitlist phase.
# Confirmation emails are sent synchronously in the Django view (fail_silently=True)
# so a Brevo hiccup never blocks a signup. Re-add the worker when daily review
# reminders are needed post-launch — see backend/config/celery.py for the stub.
